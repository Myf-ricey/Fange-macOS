name: Bug 报告
description: 报告可重复的软件问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿上传私人文件、完整用户路径或账号信息。
  - type: input
    id: version
    attributes:
      label: 饭格版本
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS 与芯片
      placeholder: macOS 26.5 / Apple M2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true

